<div class="mx-auto max-w-md px-4 py-10">
  <h1 class="text-2xl font-semibold tracking-tight">Set your password</h1>

  <p *ngIf="incomplete" class="mt-4 rounded-2xl border border-red-500/30 bg-red-500/10 p-4 text-sm text-red-200">
    This invitation link is incomplete. Use the link from your email.
  </p>

  <div *ngIf="message() as text" class="mt-4 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4">
    <p class="text-sm text-emerald-200">{{ text }}</p>
    <a
      routerLink="/account/login"
      class="mt-4 inline-block rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-white hover:bg-white/10 transition"
    >
      Go to login
    </a>
  </div>

  <form
    *ngIf="!incomplete && !message()"
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="mt-6 space-y-4"
  >
    <label class="block">
      <span class="text-sm font-medium text-slate-200">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/40 px-4 py-3 text-slate-100 outline-none transition focus:border-indigo-400/60"
      />
    </label>

    <label class="block">
      <span class="text-sm font-medium text-slate-200">Confirm password</span>
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/40 px-4 py-3 text-slate-100 outline-none transition focus:border-indigo-400/60"
      />
    </label>

    <p class="text-xs text-slate-400">
      8-20 characters, with at least one uppercase letter, one digit and one special character.
    </p>

    <div *ngIf="error() as text" class="rounded-2xl border border-rose-500/20 bg-rose-500/10 px-4 py-3 text-sm text-rose-200 whitespace-pre-line">
      {{ text }}
    </div>

    <button
      type="submit"
      [disabled]="form.invalid || loading()"
      class="w-full rounded-xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Set password
    </button>
  </form>
</div>
