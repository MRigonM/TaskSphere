<div class="mx-auto max-w-md px-4 py-10">
  <h1 class="text-2xl font-semibold tracking-tight">Forgot your password?</h1>
  <p class="mt-1 text-sm text-slate-300">
    Enter your email address and we will send you a link to choose a new one.
  </p>

  <div *ngIf="message() as text" class="mt-6 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-4">
    <p class="text-sm text-emerald-200">{{ text }}</p>
    <a
      routerLink="/account/login"
      class="mt-4 inline-block rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-white hover:bg-white/10 transition"
    >
      Back to login
    </a>
  </div>

  <form *ngIf="!message()" [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
    <label class="block">
      <span class="text-sm font-medium text-slate-200">Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@company.com"
        class="mt-2 w-full rounded-xl border border-white/10 bg-slate-950/40 px-4 py-3 text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400/60"
      />
    </label>

    <button
      type="submit"
      [disabled]="form.invalid || loading()"
      class="w-full rounded-xl bg-indigo-500 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400 disabled:cursor-not-allowed disabled:opacity-60"
    >
      Send the link
    </button>
  </form>
</div>
