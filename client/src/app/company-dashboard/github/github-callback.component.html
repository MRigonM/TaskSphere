<div class="mx-auto max-w-6xl px-4 py-8">

  <ng-container *ngIf="error() as message; else connecting">
    <div class="rounded-2xl border border-red-500/30 bg-red-500/10 p-6">
      <h1 class="text-lg font-semibold text-red-100">Could not connect GitHub</h1>
      <p class="mt-2 text-sm text-red-200">{{ message }}</p>
      <a
        routerLink="/dashboard/github"
        class="mt-4 inline-block rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-white hover:bg-white/10 transition"
      >
        Back to GitHub settings
      </a>
    </div>
  </ng-container>

  <ng-template #connecting>
    <p class="text-sm text-white/60">Finishing the GitHub connection…</p>
  </ng-template>

</div>
